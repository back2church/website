name: Sync Notion wiki & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'   # daily ~04:17 Swiss time
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html 404.html CNAME assets data _site/
      - name: Pull public wiki entries from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          OUT_DIR: _site
        run: node scripts/sync-notion.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
